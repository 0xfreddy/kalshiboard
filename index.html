<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>FlipOff.</title>
  <link rel="stylesheet" href="css/reset.css?v=6">
  <link rel="stylesheet" href="css/layout.css?v=6">
  <link rel="stylesheet" href="css/board.css?v=6">
  <link rel="stylesheet" href="css/tile.css?v=6">
  <link rel="stylesheet" href="css/responsive.css?v=6">
</head>
<body>

  <div class="app-shell">
    <main class="board-stage" id="board-container"></main>

    <button class="panel-toggle" id="panel-toggle" type="button" aria-controls="settings-panel" aria-expanded="true" title="Settings">
      ⚙
    </button>

    <aside class="settings-panel" id="settings-panel" aria-label="Board settings">
      <div class="settings-header">
        <div>
          <h1>FlipOff.</h1>
          <p>Display text</p>
        </div>
        <button class="icon-button" id="close-panel-btn" type="button" title="Hide settings">×</button>
      </div>

      <form class="settings-form" id="settings-form">
        <label for="message-input">Board text</label>
        <textarea id="message-input" rows="6" maxlength="180" spellcheck="false">FLIPOFF
FULL SCREEN
SPLIT FLAP
DISPLAY</textarea>

        <div class="settings-actions">
          <button class="primary-button" type="submit">Apply</button>
          <button class="secondary-button" id="sample-btn" type="button">Sample</button>
        </div>
      </form>

      <div class="control-row">
        <button class="icon-button" id="fullscreen-btn" type="button" title="Fullscreen">⛶</button>
        <button class="icon-button" id="volume-btn" type="button" title="Toggle sound">♪</button>
      </div>
    </aside>
  </div>

  <script type="module" src="js/main.js?v=6"></script>
</body>
</html>
